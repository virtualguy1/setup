# ==============================================================================
# Mango Wayland Compositor Configuration
#
# Installed to ~/.config/mango/config.conf by mangoInstall.sh
# Docs: https://mangowm.github.io/docs
# Noctalia Integration: https://docs.noctalia.dev/noctalia/compositor-settings/mango/
#
# Validate without launching: mango -c ~/.config/mango/config.conf -p
# ==============================================================================

# ------------------------------------------------------------------------------
# Autostart
# ------------------------------------------------------------------------------
# Autostart Noctalia shell (provides bar, launcher, notifications, lock screen,
# wallpaper, OSD, control center, and polkit authentication agent).
exec-once=noctalia

# ------------------------------------------------------------------------------
# Environment Variables
# ------------------------------------------------------------------------------
env=XDG_CURRENT_DESKTOP,mango
env=XDG_SESSION_TYPE,wayland
env=XDG_SESSION_DESKTOP,mango
env=QT_QPA_PLATFORM,wayland;xcb
env=GDK_BACKEND,wayland,x11,*
env=ELECTRON_OZONE_PLATFORM_HINT,auto
env=MOZ_ENABLE_WAYLAND,1

# ------------------------------------------------------------------------------
# Visuals & Compositor Effects (Tuned for Noctalia)
# ------------------------------------------------------------------------------
# Mango's SceneFX layer blur does not filter by surface opacity. To prevent
# transparent Noctalia surfaces from receiving unintended compositor blur and
# double shadows, layer blur and layer shadows are disabled here while window
# effects remain active.
blur=1
blur_layer=0
blur_optimized=1
blur_params_num_passes=2
blur_params_radius=5
blur_params_noise=0.02
blur_params_brightness=0.9
blur_params_contrast=0.9
blur_params_saturation=1.0

# Shadows
shadows=1
layer_shadows=0
shadow_only_floating=0
shadows_size=4
shadows_blur=12
shadows_position_x=2
shadows_position_y=2
shadowscolor=0x000000ff

# Window Borders & Opacity
borderpx=2
border_radius=8
no_radius_when_single=0
focused_opacity=1.0
unfocused_opacity=0.92

# Palette colors (Tokyo Night). Mango colors are 0xRRGGBBAA - the alpha byte
# is required, otherwise the value is misread (e.g. 0x7aa2f7 -> R=00 G=7a B=a2 A=f7).
bordercolor=0x383e5aff
focuscolor=0x7aa2f7ff
urgentcolor=0xf7768eff

# Cursor (bibata-cursor-theme-bin is installed by mangoInstall.sh; Mango exports
# XCURSOR_THEME / XCURSOR_SIZE to clients from these values)
cursor_theme=Bibata-Modern-Ice
cursor_size=24

# ------------------------------------------------------------------------------
# Animations
# ------------------------------------------------------------------------------
animations=1
layer_animations=0
animation_type_open=slide
animation_type_close=slide
animation_fade_in=1
animation_fade_out=1
animation_duration_move=400
animation_duration_open=350
animation_duration_close=350
animation_duration_focus=300

# ------------------------------------------------------------------------------
# Layouts & Scroller
# ------------------------------------------------------------------------------
# Per-tag default layout. Supported layout_name values:
# tile, scroller, grid, deck, monocle, center_tile, vertical_tile, vertical_scroller
tagrule=id:1,layout_name:tile
tagrule=id:2,layout_name:tile
tagrule=id:3,layout_name:tile
tagrule=id:4,layout_name:tile
tagrule=id:5,layout_name:tile
tagrule=id:6,layout_name:tile
tagrule=id:7,layout_name:tile
tagrule=id:8,layout_name:tile
tagrule=id:9,layout_name:tile

# Scroller layout settings
scroller_structs=20
scroller_default_proportion=0.8
scroller_focus_center=0
scroller_prefer_center=1

# ------------------------------------------------------------------------------
# Input Configuration
# ------------------------------------------------------------------------------
# Keyboard layout (leave empty for system default or set e.g. "us")
# xkb_rules_layout=us
# xkb_rules_options=compose:ralt,caps:escape

# ------------------------------------------------------------------------------
# Keybindings (Mod = Super)
# ------------------------------------------------------------------------------

# --- Application Launchers & Terminal ---
bind=SUPER,Return,spawn,alacritty
bind=SUPER,t,spawn,alacritty

# --- Noctalia Shell IPC Integrations ---
# Toggle Noctalia application launcher
bind=SUPER,space,spawn,noctalia msg panel-toggle launcher

# Toggle Noctalia Control Center (quick settings, audio, notifications)
bind=SUPER,s,spawn,noctalia msg panel-toggle control-center
bind=SUPER,n,spawn,noctalia msg panel-toggle control-center

# Toggle Noctalia Settings GUI
bind=SUPER,comma,spawn,noctalia msg settings-toggle

# Toggle Noctalia Clipboard Manager
bind=SUPER,v,spawn,noctalia msg panel-toggle clipboard

# Toggle Noctalia Session Menu (Lock, Suspend, Reboot, Poweroff)
bind=SUPER,Escape,spawn,noctalia msg panel-toggle session

# Lock screen immediately
bind=SUPER+ALT,l,spawn,noctalia msg session lock

# --- Audio & Hardware Controls (routed through Noctalia OSD) ---
bind=NONE,XF86AudioRaiseVolume,spawn,noctalia msg volume-up
bind=NONE,XF86AudioLowerVolume,spawn,noctalia msg volume-down
bind=NONE,XF86AudioMute,spawn,noctalia msg volume-mute
bind=NONE,XF86MonBrightnessUp,spawn,noctalia msg brightness-up
bind=NONE,XF86MonBrightnessDown,spawn,noctalia msg brightness-down

# Media playback via playerctl
bind=NONE,XF86AudioPlay,spawn,playerctl play-pause
bind=NONE,XF86AudioNext,spawn,playerctl next
bind=NONE,XF86AudioPrev,spawn,playerctl previous

# --- Screenshots (Noctalia screenshot service; output policy in [shell.screenshot]) ---
bind=NONE,Print,spawn,noctalia msg screenshot-fullscreen
bind=SHIFT,Print,spawn,noctalia msg screenshot-region

# --- Window Management ---
# Close / Kill focused window
bind=SUPER,q,killclient

# Toggle fullscreen / floating / maximize
bind=SUPER,f,togglefullscreen
bind=SUPER+SHIFT,f,togglefakefullscreen
bind=SUPER,backslash,togglefloating
bind=SUPER,a,togglemaximizescreen

# Focus navigation (vi keys & arrow keys)
bind=SUPER,h,focusdir,left
bind=SUPER,l,focusdir,right
bind=SUPER,k,focusdir,up
bind=SUPER,j,focusdir,down
bind=SUPER,Left,focusdir,left
bind=SUPER,Right,focusdir,right
bind=SUPER,Up,focusdir,up
bind=SUPER,Down,focusdir,down

# Window swapping / moving
bind=SUPER+SHIFT,h,exchange_client,left
bind=SUPER+SHIFT,l,exchange_client,right
bind=SUPER+SHIFT,k,exchange_client,up
bind=SUPER+SHIFT,j,exchange_client,down
bind=SUPER+SHIFT,Left,exchange_client,left
bind=SUPER+SHIFT,Right,exchange_client,right
bind=SUPER+SHIFT,Up,exchange_client,up
bind=SUPER+SHIFT,Down,exchange_client,down

# Window resizing
bind=SUPER+CTRL,h,resizewin,-50,+0
bind=SUPER+CTRL,l,resizewin,+50,+0
bind=SUPER+CTRL,k,resizewin,+0,-50
bind=SUPER+CTRL,j,resizewin,+0,+50
bind=SUPER+CTRL,Left,resizewin,-50,+0
bind=SUPER+CTRL,Right,resizewin,+50,+0
bind=SUPER+CTRL,Up,resizewin,+0,-50
bind=SUPER+CTRL,Down,resizewin,+0,+50

# Layout controls
bind=SUPER,w,switch_layout
bind=SUPER,e,incnmaster,1
bind=SUPER+SHIFT,e,incnmaster,-1
bind=SUPER,r,reload_config

# Session quit (exit Mango compositor)
bind=SUPER+SHIFT,q,quit
bind=SUPER+SHIFT,Escape,quit

# --- Tag / Workspace Navigation (Tags 1-9) ---
# View tag
bind=SUPER,1,view,1,0
bind=SUPER,2,view,2,0
bind=SUPER,3,view,3,0
bind=SUPER,4,view,4,0
bind=SUPER,5,view,5,0
bind=SUPER,6,view,6,0
bind=SUPER,7,view,7,0
bind=SUPER,8,view,8,0
bind=SUPER,9,view,9,0

# Move window to tag
bind=SUPER+SHIFT,1,tag,1,0
bind=SUPER+SHIFT,2,tag,2,0
bind=SUPER+SHIFT,3,tag,3,0
bind=SUPER+SHIFT,4,tag,4,0
bind=SUPER+SHIFT,5,tag,5,0
bind=SUPER+SHIFT,6,tag,6,0
bind=SUPER+SHIFT,7,tag,7,0
bind=SUPER+SHIFT,8,tag,8,0
bind=SUPER+SHIFT,9,tag,9,0

# Toggle tag view (multi-tag)
bind=SUPER+CTRL,1,toggletag,1
bind=SUPER+CTRL,2,toggletag,2
bind=SUPER+CTRL,3,toggletag,3
bind=SUPER+CTRL,4,toggletag,4
bind=SUPER+CTRL,5,toggletag,5
bind=SUPER+CTRL,6,toggletag,6
bind=SUPER+CTRL,7,toggletag,7
bind=SUPER+CTRL,8,toggletag,8
bind=SUPER+CTRL,9,toggletag,9

# ------------------------------------------------------------------------------
# Mouse Bindings
# ------------------------------------------------------------------------------
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize

# ------------------------------------------------------------------------------
# Window Rules
# ------------------------------------------------------------------------------
# Dialogs and file pickers floating by default (polkit prompts are drawn by
# Noctalia's own agent as a layer surface, so no rule is needed for them)
windowrule=isfloating:1,appid:xdg-desktop-portal-gtk
windowrule=isfloating:1,appid:org.freedesktop.impl.portal.desktop.gtk
windowrule=isfloating:1,title:Open File
windowrule=isfloating:1,title:Save File
windowrule=isfloating:1,title:Select a Folder
