# Alacritty configuration - generated by niriInstall.sh
[font]
size = 11.0

[font.normal]
family = "JetBrainsMono Nerd Font"
style  = "Regular"

[window]
padding = { x = 6, y = 6 }

[selection]
save_to_clipboard = true

[keyboard]
bindings = [
  { key = "C", mods = "Super", action = "Copy" },
  { key = "V", mods = "Super", action = "Paste" },
]
