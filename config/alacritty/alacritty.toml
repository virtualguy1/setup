# Alacritty configuration - installed by niriInstall.sh
# The font family placeholder below is filled from $MONO_FONT by the script.
[font]
size = 11.0

[font.normal]
family = "__MONO_FONT__"
style  = "Regular"

[window]
padding = { x = 6, y = 6 }

[selection]
save_to_clipboard = true

[keyboard]
bindings = [
  { key = "C", mods = "Super", action = "Copy" },
  { key = "V", mods = "Super", action = "Paste" },
]
