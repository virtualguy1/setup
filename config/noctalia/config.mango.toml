# Noctalia configuration for the Mango compositor - installed to
# ~/.config/noctalia/config.toml by mangoInstall.sh
#
# Placeholders below are filled in by the script (override via environment):
#   __UI_FONT__        <- UI_FONT        (default: JetBrainsMono Nerd Font Propo)
#   __THEME__          <- NOCTALIA_THEME (default: Tokyo-Night)
#   __WALLPAPER_DIR__  <- WALLPAPER_DIR  (default: ~/Pictures/Wallpapers)
#
# Only non-default values are set; everything else falls back to Noctalia's
# defaults. Hot-reloads on save. Defaults reference:
#   https://github.com/noctalia-dev/noctalia/blob/main/example.toml
# Mango integration notes:
#   https://docs.noctalia.dev/noctalia/compositor-settings/mango/

[shell]
font_family  = "__UI_FONT__"
polkit_agent = true             # GUI auth prompts (no other polkit agent is installed)

[theme]
mode    = "dark"
source  = "builtin"
builtin = "__THEME__"

# ── Bar ───────────────────────────────────────────────────────────────────────
# Per the Noctalia Mango docs, Noctalia's rendered drop shadows are disabled on
# layer surfaces; Mango's SceneFX handles window shadows (layer_shadows=0 in
# ~/.config/mango/config.conf keeps the two from stacking).
[bar.main]
position       = "top"
shadow         = false
contact_shadow = false
start  = ["sysmon", "active_window", "media"]
center = ["workspaces"]
end    = ["tray", "battery", "volume", "clock", "control-center"]

[widget.clock]
format = "{:%H:%M %a, %b %d}"

[dock]
shadow = false

[shell.panel]
shadow = false

# ── Wallpaper (rotate randomly every 5 minutes) ───────────────────────────────
[wallpaper]
enabled             = true
fill_mode           = "crop"
transition_duration = 1500
directory           = "__WALLPAPER_DIR__"

[wallpaper.automation]
enabled          = true
interval_seconds = 300
order            = "random"
