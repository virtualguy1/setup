# Noctalia configuration - installed to ~/.config/noctalia/config.toml by niriInstall.sh / umbrielInstall.sh
#
# Placeholder tokens (double-underscore UPPER_CASE) are filled in by the script
# from these environment variables:
#   UI_FONT        -> [shell] font_family     (default: JetBrainsMono Nerd Font Propo)
#   NOCTALIA_THEME -> [theme] builtin         (default: Tokyo-Night)
#   WALLPAPER_DIR  -> [wallpaper] directory   (default: ~/Pictures/Wallpapers)
#
# Only non-default values are set; everything else falls back to Noctalia's
# defaults. Hot-reloads on save. Defaults reference:
#   https://github.com/noctalia-dev/noctalia/blob/main/example.toml

[shell]
font_family  = "__UI_FONT__"
polkit_agent = true             # GUI auth prompts (no other polkit agent is installed)

[theme]
mode    = "dark"
source  = "builtin"
builtin = "__THEME__"

# ── Bar (tutorial layout) ─────────────────────────────────────────────────────
[bar.main]
position = "top"
start  = ["sysmon", "active_window", "media"]
center = ["workspaces"]
end    = ["tray", "battery", "volume", "clock", "control-center"]

[widget.clock]
format = "{:%H:%M %a, %b %d}"

# ── Wallpaper (tutorial: rotate randomly every 5 minutes) ────────────────────
[wallpaper]
enabled             = true
fill_mode           = "crop"
transition_duration = 1500
directory           = "__WALLPAPER_DIR__"

[wallpaper.automation]
enabled          = true
interval_seconds = 300
order            = "random"

# Blurred wallpaper copy behind the compositor's Overview.
# niri: pairs with the noctalia-backdrop layer-rule in config.kdl.
# Umbriel: harmless; its overview blurs the wallpaper itself ([overview] background_blur).
[backdrop]
enabled = true

# ── Idle (Noctalia's built-in idle manager; no swayidle needed) ──────────────
# Lock after 10 minutes, turn the screen off 1 minute later. Off by default
# upstream, so both are enabled explicitly here.
[idle.behavior.lock]
enabled = true
timeout = 600
action  = "lock"

[idle.behavior.screen-off]
enabled = true
timeout = 660
action  = "screen_off"
